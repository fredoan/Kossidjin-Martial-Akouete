<style>
:root{--navy:#0A1A2F;--navy-deep:#050F1C;--gold:#C6A34B;--gold-bright:#E0C87C;--gold-pale:#F2E5C9;--ivory:#FCFAF6;--white:#FFF;--text-dark:#1A1A1A;--text-muted:#6B7280;--border-gold:rgba(198,163,75,.25);--shadow-gold:0 15px 35px rgba(198,163,75,.3);--tr:cubic-bezier(.4,0,.2,1);--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--text-dark);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}

#loader{position:fixed;inset:0;background:var(--navy-deep);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-globe{width:80px;height:80px;position:relative;margin-bottom:25px}
.globe-ring{position:absolute;inset:0;border:2px solid rgba(198,163,75,.3);border-radius:50%;animation:spin 10s linear infinite}
.globe-meridian{position:absolute;width:80%;height:80%;top:10%;left:10%;border:2px dashed var(--gold);border-radius:50%;animation:spin 15s linear infinite reverse;opacity:.7}
.globe-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px var(--gold)}
@keyframes spin{100%{transform:rotate(360deg)}}
.loader-name{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--gold-bright);letter-spacing:.08em}
.loader-sub{font-size:.7rem;text-transform:uppercase;letter-spacing:.35em;color:rgba(198,163,75,.6);margin-top:8px}

nav{position:fixed;top:0;left:0;width:100%;z-index:1000;padding:14px 50px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,26,47,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-gold);transition:all .4s var(--tr)}
nav.scrolled{padding:10px 50px;background:rgba(10,26,47,.95);box-shadow:0 4px 30px rgba(0,0,0,.4)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 15px rgba(198,163,75,.3)}
.nav-links{display:flex;gap:1.6rem;list-style:none;align-items:center}
.nav-links a{text-decoration:none;color:rgba(255,255,255,.85);font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;position:relative;padding-bottom:4px;transition:color .3s}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:var(--gold);transition:width .3s}
.nav-links a:hover,.nav-links a.active{color:var(--white)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-cta{background:var(--gold);color:var(--navy-deep)!important;padding:9px 20px;border-radius:50px;font-weight:700!important;font-size:.72rem!important;transition:all .35s}
.nav-cta:hover{background:var(--gold-bright);transform:translateY(-2px);box-shadow:var(--shadow-gold)}
.nav-cta::after{display:none!important}
.hamburger{display:none;flex-direction:column;gap:6px;cursor:pointer;background:none;border:none;z-index:1100}
.hamburger span{width:28px;height:2.5px;background:var(--gold);display:block;transition:.35s;border-radius:2px}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1040;opacity:0;visibility:hidden;transition:.4s}
.menu-overlay.active{opacity:1;visibility:visible}

.page-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);padding:150px 40px 70px;text-align:center;position:relative;overflow:hidden}
.page-header::before{content:'';position:absolute;inset:0;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" opacity="0.04"><circle cx="100" cy="100" r="80" stroke="%23C6A34B" stroke-width="0.8"/><path d="M20 100 L180 100 M100 20 L100 180" stroke="%23C6A34B" stroke-width="0.5"/></svg>');background-size:150px 150px}
.page-header h1{font-family:'Playfair Display',serif;color:var(--white);font-size:clamp(2rem,4vw,2.8rem);font-weight:800;position:relative;z-index:2;margin-bottom:10px}
.page-header p{color:var(--gold-pale);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;position:relative;z-index:2}
.breadcrumb{position:relative;z-index:2;font-size:.7rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.2em;margin-bottom:14px}
.breadcrumb a{color:var(--gold);text-decoration:none}

.section{padding:60px 40px;max-width:1300px;margin:0 auto}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.gallery-item{border-radius:14px;overflow:hidden;aspect-ratio:1/1;border:2px solid transparent;transition:all .4s;cursor:pointer;position:relative;background:#000}
.gallery-item:hover{border-color:var(--gold);transform:scale(1.02);box-shadow:var(--shadow-card)}
.gallery-item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery-item:hover img{transform:scale(1.08)}
.gallery-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(5,15,28,.85));opacity:0;transition:opacity .3s;display:flex;align-items:flex-end;padding:16px}
.gallery-item:hover .gallery-overlay{opacity:1}
.gallery-caption{color:var(--white);font-size:.8rem;line-height:1.4}
.empty-msg{text-align:center;padding:80px 20px;color:var(--text-muted);font-style:italic;grid-column:1/-1}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(2,10,18,.96);z-index:10000;display:none;align-items:center;justify-content:center;padding:30px;backdrop-filter:blur(8px)}
.lightbox.open{display:flex;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lightbox img{max-width:95%;max-height:85vh;border-radius:10px;box-shadow:0 25px 60px rgba(0,0,0,.6);border:2px solid var(--border-gold)}
.lightbox-close{position:absolute;top:24px;right:24px;background:var(--gold);color:var(--navy-deep);border:none;width:44px;height:44px;border-radius:50%;font-size:1.5rem;font-weight:700;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;transition:all .3s;font-family:inherit}
.lightbox-close:hover{background:var(--gold-bright);transform:rotate(90deg)}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(198,163,75,.15);border:1px solid var(--border-gold);color:var(--gold);width:50px;height:50px;border-radius:50%;font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;font-family:inherit}
.lightbox-nav:hover{background:var(--gold);color:var(--navy-deep)}
.lightbox-prev{left:24px}
.lightbox-next{right:24px}

footer{background:#020A12;text-align:center;padding:26px;color:#777;font-size:.72rem;letter-spacing:.08em;border-top:1px solid var(--border-gold);margin-top:60px}
footer span{color:var(--gold)}

.whatsapp-float{position:fixed;bottom:30px;right:30px;width:60px;height:60px;background:var(--wa);border-radius:50%;box-shadow:0 8px 25px rgba(0,0,0,.4);z-index:9998;display:flex;align-items:center;justify-content:center;text-decoration:none}
.whatsapp-float svg{width:32px;height:32px;fill:#fff}

.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s var(--tr)}
.reveal.visible{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  nav{padding:12px 20px}
  .nav-links{position:fixed;top:0;right:-100%;width:75%;max-width:320px;height:100vh;background:rgba(10,26,47,.98);flex-direction:column;justify-content:center;gap:2.2rem;transition:right .5s;z-index:1050;border-left:1px solid var(--border-gold)}
  .nav-links.active{right:0}
  .hamburger{display:flex}
  .section{padding:40px 20px}
  .page-header{padding:130px 20px 50px}
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .lightbox-nav{width:42px;height:42px;font-size:1.2rem}
  .lightbox-prev{left:10px}
  .lightbox-next{right:10px}
}
</style>
</head>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDq-IUPVlMC6kQGgQyvkKNECfzCJ3hVMaI",
  authDomain: "km-akouete.firebaseapp.com",
  projectId: "km-akouete",
  storageBucket: "km-akouete.firebasestorage.app",
  messagingSenderId: "714384386306",
  appId: "1:714384386306:web:148357b99da9dea30d7a1b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const grid = document.getElementById('galleryGrid');
let IMAGES = [];
let currentIndex = 0;

// Fallback local si Firestore vide
const FALLBACK = Array.from({length:10}, (_,i)=>({ URL:`${i+1}.jpeg`, Légende:`Photo ${i+1}` }));

async function loadGallery(){
  let items = [];
  try{
    const q = query(collection(db,'Galerie'));
    const snap = await getDocs(q);
    snap.forEach(d=>items.push(d.data()));
    if(items.length){
      items.sort((a,b)=> (Number(a.ordre)||0) - (Number(b.ordre)||0));
    }
  }catch(e){ console.warn('Firestore galerie indisponible:',e); }
  if(!items.length) items = FALLBACK;
  IMAGES = items;
  render();
}

function render(){
  grid.innerHTML='';
  if(!IMAGES.length){
    grid.innerHTML='<div class="empty-msg">Aucune image pour le moment.</div>';
    return;
  }
  IMAGES.forEach((img,i)=>{
    const url = img.URL || img.url || '';
    const cap = img['Légende'] || img.legende || '';
    const el = document.createElement('div');
    el.className='gallery-item reveal';
    el.innerHTML = `
      <img src="${url}" alt="${cap||'Photo'}" loading="lazy">
      ${cap?`<div class="gallery-overlay"><div class="gallery-caption">${cap}</div></div>`:''}
    `;
    el.addEventListener('click', ()=>openLb(i));
    grid.appendChild(el);
  });
  const obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:.1});
  grid.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
}

/* LIGHTBOX */
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
function openLb(i){
  currentIndex = i;
  lbImg.src = IMAGES[i].URL || IMAGES[i].url;
  lb.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeLb(){ lb.classList.remove('open'); document.body.style.overflow=''; }
function nextLb(){ currentIndex=(currentIndex+1)%IMAGES.length; openLb(currentIndex); }
function prevLb(){ currentIndex=(currentIndex-1+IMAGES.length)%IMAGES.length; openLb(currentIndex); }
document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbNext').addEventListener('click', nextLb);
document.getElementById('lbPrev').addEventListener('click', prevLb);
lb.addEventListener('click',(e)=>{ if(e.target===lb) closeLb(); });
document.addEventListener('keydown',(e)=>{
  if(!lb.classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowRight') nextLb();
  if(e.key==='ArrowLeft') prevLb();
});

/* LOADER / NAV */
const loader=document.getElementById('loader');
const hide=()=>{loader.classList.add('hidden');document.body.style.overflow=''};
document.body.style.overflow='hidden';
window.addEventListener('load',()=>setTimeout(hide,700));
setTimeout(hide,1800);

const navbar=document.getElementById('navbar');
window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.scrollY>40));
const ham=document.getElementById('hamburger'),nav=document.getElementById('navLinks'),ov=document.getElementById('menuOverlay');
const open=()=>{nav.classList.add('active');ham.classList.add('active');ov.classList.add('active');document.body.style.overflow='hidden'};
const closeM=()=>{nav.classList.remove('active');ham.classList.remove('active');ov.classList.remove('active');document.body.style.overflow=''};
ham.addEventListener('click',()=>nav.classList.contains('active')?closeM():open());
ov.addEventListener('click',closeM);

loadGallery();
</script>

<style>
:root{--navy:#0A1A2F;--navy-light:#0F2544;--navy-deep:#050F1C;--gold:#C6A34B;--gold-bright:#E0C87C;--gold-pale:#F2E5C9;--ivory:#FCFAF6;--white:#FFF;--text-dark:#1A1A1A;--text-muted:#6B7280;--border-gold:rgba(198,163,75,.25);--shadow-gold:0 15px 35px rgba(198,163,75,.3);--shadow-card:0 25px 50px -12px rgba(0,0,0,.25);--tr:cubic-bezier(.4,0,.2,1);--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:'Inter',sans-serif;background:var(--ivory);color:var(--text-dark);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}

#loader{position:fixed;inset:0;background:var(--navy-deep);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s,visibility .8s}
#loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-globe{width:80px;height:80px;position:relative;margin-bottom:25px}
.globe-ring{position:absolute;inset:0;border:2px solid rgba(198,163,75,.3);border-radius:50%;animation:spin 10s linear infinite}
.globe-meridian{position:absolute;width:80%;height:80%;top:10%;left:10%;border:2px dashed var(--gold);border-radius:50%;animation:spin 15s linear infinite reverse;opacity:.7}
.globe-dot{position:absolute;top:50%;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 20px var(--gold)}
@keyframes spin{100%{transform:rotate(360deg)}}
.loader-name{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;color:var(--gold-bright);letter-spacing:.08em}
.loader-sub{font-size:.7rem;text-transform:uppercase;letter-spacing:.35em;color:rgba(198,163,75,.6);margin-top:8px}

nav{position:fixed;top:0;left:0;width:100%;z-index:1000;padding:14px 50px;display:flex;align-items:center;justify-content:space-between;background:rgba(10,26,47,.75);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-gold);transition:all .4s var(--tr)}
nav.scrolled{padding:10px 50px;background:rgba(10,26,47,.95);box-shadow:0 4px 30px rgba(0,0,0,.4)}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.nav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);box-shadow:0 0 15px rgba(198,163,75,.3)}
.nav-links{display:flex;gap:1.6rem;list-style:none;align-items:center}
.nav-links a{text-decoration:none;color:rgba(255,255,255,.85);font-size:.78rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;position:relative;padding-bottom:4px;transition:color .3s}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1.5px;background:var(--gold);transition:width .3s}
.nav-links a:hover,.nav-links a.active{color:var(--white)}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-cta{background:var(--gold);color:var(--navy-deep)!important;padding:9px 20px;border-radius:50px;font-weight:700!important;font-size:.72rem!important;transition:all .35s}
.nav-cta:hover{background:var(--gold-bright);transform:translateY(-2px);box-shadow:var(--shadow-gold)}
.nav-cta::after{display:none!important}
.hamburger{display:none;flex-direction:column;gap:6px;cursor:pointer;background:none;border:none;z-index:1100}
.hamburger span{width:28px;height:2.5px;background:var(--gold);display:block;transition:.35s;border-radius:2px}
.hamburger.active span:nth-child(1){transform:rotate(45deg) translate(6px,6px)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:rotate(-45deg) translate(6px,-6px)}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1040;opacity:0;visibility:hidden;transition:.4s}
.menu-overlay.active{opacity:1;visibility:visible}

.article-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-deep) 100%);padding:150px 40px 60px;text-align:center;position:relative;overflow:hidden}
.article-header::before{content:'';position:absolute;inset:0;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" opacity="0.04"><circle cx="100" cy="100" r="80" stroke="%23C6A34B" stroke-width="0.8"/><path d="M20 100 L180 100 M100 20 L100 180" stroke="%23C6A34B" stroke-width="0.5"/></svg>');background-size:150px 150px}
.article-header .container{position:relative;z-index:2;max-width:900px;margin:0 auto}
.article-header .breadcrumb{font-size:.7rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.2em;margin-bottom:14px}

.article-header .meta{margin-top:18px;color:rgba(255,255,255,.6);font-size:.82rem}
.article-header .meta strong{color:var(--gold-pale)}

.article-wrap{max-width:840px;margin:-40px auto 0;padding:0 20px;position:relative;z-index:5}
.article-hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;border:3px solid var(--gold);box-shadow:var(--shadow-card);background:#000}
.article-content{background:var(--white);padding:55px 60px;border-radius:20px;border:1px solid var(--border-gold);box-shadow:0 10px 40px rgba(0,0,0,.05);margin-top:35px}
.article-content p{font-size:1rem;line-height:1.9;color:#333;margin-bottom:22px}
.article-content h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--navy);margin:38px 0 16px;font-weight:700;line-height:1.3}
.article-content h3{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--navy);margin:30px 0 12px;font-weight:700}
.article-content ul,.article-content ol{margin:16px 0 22px 28px}
.article-content li{margin-bottom:10px;line-height:1.8;color:#333}
.article-content blockquote{border-left:4px solid var(--gold);padding:18px 26px;background:rgba(198,163,75,.06);margin:26px 0;font-style:italic;font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--navy);border-radius:0 10px 10px 0}
.article-content img{max-width:100%;height:auto;border-radius:12px;margin:20px 0;display:block}
.article-content a{color:var(--gold);text-decoration:underline;font-weight:500}
.article-content a:hover{color:var(--gold-bright)}
.article-content strong{color:var(--navy);font-weight:600}
.article-content hr{border:none;border-top:1px solid var(--border-gold);margin:35px 0}

.share-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:35px;padding-top:30px;border-top:1px solid var(--border-gold)}
.share-bar .label{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.18em;font-weight:600}
.share-btn{width:40px;height:40px;border-radius:50%;background:var(--ivory);border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;color:var(--gold);transition:all .3s;text-decoration:none}

.share-btn svg{width:18px;height:18px;fill:currentColor}

.back-cta{text-align:center;margin-top:50px}
.btn-gold{background:var(--gold);color:var(--navy-deep);padding:14px 32px;border-radius:50px;font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;transition:all .35s;display:inline-block}

footer{background:#020A12;text-align:center;padding:26px;color:#777;font-size:.72rem;letter-spacing:.08em;border-top:1px solid var(--border-gold);margin-top:60px}

.whatsapp-float{position:fixed;bottom:30px;right:30px;width:60px;height:60px;background:var(--wa);border-radius:50%;box-shadow:0 8px 25px rgba(0,0,0,.4);z-index:9998;display:flex;align-items:center;justify-content:center;text-decoration:none}
.whatsapp-float svg{width:32px;height:32px;fill:#fff}

@media(max-width:768px){
  nav{padding:12px 20px}
  .nav-links{position:fixed;top:0;right:-100%;width:75%;max-width:320px;height:100vh;background:rgba(10,26,47,.98);flex-direction:column;justify-content:center;gap:2.2rem;transition:right .5s;z-index:1050;border-left:1px solid var(--border-gold)}
  .nav-links.active{right:0}
  .hamburger{display:flex}
  .article-header{padding:130px 20px 50px}
  .article-content{padding:35px 25px}
  .article-wrap{padding:0 16px}
}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDq-IUPVlMC6kQGgQyvkKNECfzCJ3hVMaI",
  authDomain: "km-akouete.firebaseapp.com",
  projectId: "km-akouete",
  storageBucket: "km-akouete.firebasestorage.app",
  messagingSenderId: "714384386306",
  appId: "1:714384386306:web:148357b99da9dea30d7a1b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const main = document.getElementById('mainContent');
const params = new URLSearchParams(location.search);
const slug = params.get('slug');
const id = params.get('id');

function fmtDate(v){
  if(!v) return '';
  let d;
  if(typeof v === 'object' && v.toDate) d = v.toDate();
  else if(typeof v === 'object' && v.seconds) d = new Date(v.seconds*1000);
  else d = new Date(v);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
}
function escapeHtml(s=''){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function findArticle(){
  if(!slug && !id) return null;

  // 1) Si un ID direct
  if(id){
    const snap = await getDoc(doc(db,'Articles',id));
    if(snap.exists()) return { id:snap.id, ...snap.data() };
  }

  // 2) Recherche par slug
  if(slug){
    const q1 = query(collection(db,'Articles'), where('Slug','==',slug));
    let s = await getDocs(q1);
    if(!s.empty) return { id:s.docs[0].id, ...s.docs[0].data() };

    const q2 = query(collection(db,'Articles'), where('slug','==',slug));
    s = await getDocs(q2);
    if(!s.empty) return { id:s.docs[0].id, ...s.docs[0].data() };

    // 3) Fallback : slug = id
    try{
      const snap = await getDoc(doc(db,'Articles',slug));
      if(snap.exists()) return { id:snap.id, ...snap.data() };
    }catch(e){}
  }
  return null;
}

async function loadArticle(){
  try{
    const a = await findArticle();
    if(!a){
      main.innerHTML = `
        <div class="state-msg">
          <h1>Article introuvable</h1>
          <p>Cet article n'existe pas ou n'a pas encore été publié.</p>
          <p style="margin-top:20px"><a href="actualites.html">← Retour aux actualités</a></p>
        </div>`;
      return;
    }

    const published = a['publié'] ?? a['publie'] ?? a.published;
    if(!published){
      main.innerHTML = `
        <div class="state-msg">
          <h1>Article non publié</h1>
          <p>Cet article n'est pas encore accessible.</p>

    const titre = a.Titre || a.titre || 'Sans titre';
    const contenu = a.Contenu || a.contenu || a.contenuHtml || '';
    const image = a.Image || a.image || 'pp.jpeg';
    const date = fmtDate(a.createdAt || a['mise à jourAt'] || a.updatedAt);
    const url = location.href;

    document.title = `${titre} | Kossidjin Martial Akouete`;

    main.innerHTML = `

            <svg viewBox="0 0 24 24"><path d="M22.46 6c-.77.35-1.6.58-2.46.69.88-.53 1.56-1.37 1.88-2.38-.83.5-1.75.85-2.72 1.05C18.37 4.5 17.26 4 16 4c-2.35 0-4.27 1.92-4.27 4.29 0 .34.04.67.11.98C8.28 9.09 5.11 7.38 3 4.79c-.37.63-.58 1.37-.58 2.15 0 1.49.75 2.81 1.91 3.56-.71 0-1.37-.2-1.95-.5v.05c0 2.08 1.48 3.82 3.44 4.21a4.22 4.22 0 0 1-1.93.07 4.28 4.28 0 0 0 4 2.98 8.521 8.521 0 0 1-5.33 1.84c-.34 0-.68-.02-1.02-.06C3.44 20.29 5.7 21 8.12 21 16 21 20.33 14.46 20.33 8.79c0-.19 0-.37-.01-.56.84-.6 1.56-1.36 2.14-2.23z"/></svg>

    main.innerHTML = `
      <div class="state-msg">
        <h1>Erreur de chargement</h1>
        <p>Une erreur est survenue. Veuillez réessayer plus tard.</p>
        <p style="margin-top:20px"><a href="actualites.html">← Retour aux actualités</a></p>
      </div>`;
  }
}

/* LOADER / NAV */
const loader=document.getElementById('loader');
const hide=()=>{loader.classList.add('hidden');document.body.style.overflow=''};
document.body.style.overflow='hidden';
window.addEventListener('load',()=>setTimeout(hide,600));
setTimeout(hide,1600);

const navbar=document.getElementById('navbar');
window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.scrollY>40));
const ham=document.getElementById('hamburger'),nav=document.getElementById('navLinks'),ov=document.getElementById('menuOverlay');
const open=()=>{nav.classList.add('active');ham.classList.add('active');ov.classList.add('active');document.body.style.overflow='hidden'};
const closeM=()=>{nav.classList.remove('active');ham.classList.remove('active');ov.classList.remove('active');document.body.style.overflow=''};
ham.addEventListener('click',()=>nav.classList.contains('active')?closeM():open());
ov.addEventListener('click',closeM);

loadArticle();
</script>
</body>
</html>
